name: שמירה על פרויקט Supabase פעיל

# בתוכנית החינמית פרויקט שלא מקבל פניות במשך כשבוע מושהה אוטומטית,
# והאפליקציה מפסיקה לעבוד עד להפעלה ידנית. פנייה יומית אחת מאפסת את
# מונה חוסר הפעילות — אבל רק אם היא מגיעה למסד הנתונים עצמו.
#
# הפנייה הייתה ל-/auth/v1/health, וזה לא הספיק: ההרצות היו ירוקות יום
# אחרי יום והפרויקט הושהה בכל זאת, כי /auth/v1/health מגיע ל-GoTrue
# ולא מריץ שאילתת SQL. לכן נוספה לסכימה הפונקציה keep_alive(), שנקראת
# כאן דרך PostgREST ומריצה select now() בפוסטגרס.
#
# הפונקציה לא חושפת נתונים ולא כותבת דבר: אין לה פרמטרים, הגוף שלה הוא
# select now(), היא stable (ולכן כתיבה אסורה בה), והיא security invoker —
# כלומר רצה בהרשאות של anon, שממילא נשללו לו כל ההרשאות על הטבלאות.
on:
  schedule:
    # 05:17 UTC — לא בראש השעה, שם התור של GitHub עמוס והרצות נדחות.
    - cron: '17 5 * * *'
  workflow_dispatch:

# העבודה כולה היא קריאת HTTP אחת החוצה: אין checkout ואין צורך בהרשאות.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ודאי שה-secrets מוגדרים
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::חסרים secrets:$missing — יש להוסיף אותם ב-Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: פנייה לפרויקט
        env:
          # שני אלה ציבוריים מעצם הגדרתם. המפתח נשלח בכותרת בלבד ולא
          # בכתובת, כדי שלא ידלוף ללוג דרך שורת ה-curl.
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # רווח או שורה חדשה שנדבקו לסוף ה-secret הופכים את הכותרת
          # ללא תקינה ומחזירים 401 שנראה כמו מפתח שגוי.
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')

          # POST /rest/v1/rpc/keep_alive — נקודת REST אמיתית, בניגוד
          # לשורש PostgREST שחסום לכל מפתח שאינו service_role.
          status=$(curl \
            --silent \
            --show-error \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --output response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $KEY" \
            --header "Authorization: Bearer $KEY" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${URL%/}/rest/v1/rpc/keep_alive")

          if [ "$status" != "200" ]; then
            echo "::error::הפנייה ל-Supabase נכשלה עם סטטוס $status"
            head -c 500 response.json
            exit 1
          fi

          # keep_alive() מחזירה timestamptz, ולכן PostgREST מחזיר מחרוזת
          # JSON אחת עם חותמת זמן. פרויקט מושהה או שער שמחזיר דף שגיאה
          # עלולים להחזיר 200 עם גוף אחר לגמרי — בדיקת הגוף היא ההבדל
          # בין ping אמיתי לבין ירוק מדומה.
          if ! jq -e 'type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T")' \
            response.json > /dev/null 2>&1; then
            echo "::error::Supabase החזיר 200 אך הגוף אינו חותמת זמן"
            head -c 500 response.json
            exit 1
          fi

          echo "הפרויקט מגיב, והשאילתה רצה בפוסטגרס. זמן השרת: $(jq -r '.' response.json)"
